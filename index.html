    <script>
      // Теманы биринчи сүрөттөөгө чейин коёбуз — «жарк» этпеши үчүн
      (function () {
        try {
          var t = localStorage.getItem('oozeki:theme');
          if (t !== 'dark' && t !== 'light') {
            var s = JSON.parse(localStorage.getItem('oozeki:settings:v1') || '{}');
            t = s.theme === 'dark' || s.theme === 'light' ? s.theme : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
