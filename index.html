<!doctype html>
<html lang="ky">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Оозеки — кыргызча сүйлөө көндүмүн машыктыруучу тренажёр. Теманы тарт, таймерди кой, сүйлө." />
    <meta name="theme-color" content="#FAF8F3" />
    <script>
      // Теманы биринчи сырдоого чейин коёбуз — жарык «жарк» этпеши үчүн
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('oozeki:settings:v1') || '{}');
          var t =
            s.theme === 'dark' || s.theme === 'light'
              ? s.theme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Оозеки — кыргызча сүйлөө тренажёру</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
